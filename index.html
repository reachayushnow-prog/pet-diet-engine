<script>

/* =========================================================
   PET DIET ENGINE — CORE CALCULATOR
========================================================= */

(function () {

    "use strict";

    /* ---------------------------------------------------------
       ELEMENTS
    --------------------------------------------------------- */

    const petType =
        document.getElementById("petType");

    const petWeight =
        document.getElementById("petWeight");

    const weightUnit =
        document.getElementById("weightUnit");

    const lifeStage =
        document.getElementById("lifeStage");

    const foodCalories =
        document.getElementById("foodCalories");

    const calculatorPlaceholder =
        document.getElementById("calculatorPlaceholder");

    const calculatorResult =
        document.getElementById("calculatorResult");

    const calorieResult =
        document.getElementById("calorieResult");

    const rerResult =
        document.getElementById("rerResult");

    const foodResult =
        document.getElementById("foodResult");

    const foodUnit =
        document.getElementById("foodUnit");


    /* ---------------------------------------------------------
       UPDATE LIFE-STAGE OPTIONS WHEN PET TYPE CHANGES
    --------------------------------------------------------- */

    function updateLifeStages() {

        const type = petType.value;

        lifeStage.innerHTML = "";

        if (type === "dog") {

            lifeStage.innerHTML = `
                <option value="adult">
                    Adult — typical activity
                </option>

                <option value="inactive">
                    Adult — inactive / weight management
                </option>

                <option value="active">
                    Adult — active
                </option>

                <option value="puppy">
                    Puppy / growing
                </option>
            `;

        } else {

            lifeStage.innerHTML = `
                <option value="adult">
                    Adult — typical activity
                </option>

                <option value="inactive">
                    Adult — lower activity
                </option>

                <option value="active">
                    Adult — active
                </option>

                <option value="kitten">
                    Kitten / growing
                </option>
            `;

        }

    }


    petType.addEventListener(
        "change",
        updateLifeStages
    );


    /* Initialize correct options */

    updateLifeStages();


    /* ---------------------------------------------------------
       CALCULATE PET ENERGY NEEDS
    --------------------------------------------------------- */

    window.calculatePetNeeds = function () {

        const type =
            petType.value;

        const weightValue =
            parseFloat(
                petWeight.value
            );

        const unit =
            weightUnit.value;

        const stage =
            lifeStage.value;

        const foodEnergy =
            parseFloat(
                foodCalories.value
            );


        /* -----------------------------------------------------
           VALIDATE WEIGHT
        ----------------------------------------------------- */

        if (
            !Number.isFinite(weightValue) ||
            weightValue <= 0
        ) {

            alert(
                "Please enter a valid pet weight."
            );

            petWeight.focus();

            return;

        }


        /* -----------------------------------------------------
           CONVERT TO KG
        ----------------------------------------------------- */

        let kg;

        if (unit === "lb") {

            kg =
                weightValue *
                0.45359237;

        } else {

            kg =
                weightValue;

        }


        /* -----------------------------------------------------
           BASIC SAFETY RANGE
           
           This is not a medical restriction.
           It simply prevents obvious input errors.
        ----------------------------------------------------- */

        if (
            !Number.isFinite(kg) ||
            kg <= 0 ||
            kg > 150
        ) {

            alert(
                "Please enter a realistic pet weight between 0.1 kg and 150 kg."
            );

            petWeight.focus();

            return;

        }


        /* -----------------------------------------------------
           RER

           RER = 70 × body weight(kg)^0.75

           This is an estimation starting point.
        ----------------------------------------------------- */

        const rer =
            70 *
            Math.pow(
                kg,
                0.75
            );


        /* -----------------------------------------------------
           ESTIMATED MULTIPLIERS

           These are educational estimates only.

           They are NOT individualized veterinary
           feeding prescriptions.
        ----------------------------------------------------- */

        let factor;


        if (type === "dog") {

            switch (stage) {

                case "inactive":
                    factor = 1.0;
                    break;

                case "active":
                    factor = 1.6;
                    break;

                case "puppy":
                    factor = 2.0;
                    break;

                default:
                    factor = 1.4;

            }

        } else {

            switch (stage) {

                case "inactive":
                    factor = 1.0;
                    break;

                case "active":
                    factor = 1.4;
                    break;

                case "kitten":
                    factor = 2.5;
                    break;

                default:
                    factor = 1.2;

            }

        }


        const dailyCalories =
            rer * factor;


        /* -----------------------------------------------------
           DISPLAY CALORIES
        ----------------------------------------------------- */

        calorieResult.textContent =
            Math.round(
                dailyCalories
            ).toLocaleString();


        rerResult.textContent =
            Math.round(
                rer
            ).toLocaleString();


        /* -----------------------------------------------------
           CALCULATE FOOD AMOUNT

           kcal/100g → grams/day
        ----------------------------------------------------- */

        if (
            Number.isFinite(foodEnergy) &&
            foodEnergy > 0
        ) {

            const grams =
                (
                    dailyCalories /
                    foodEnergy
                ) * 100;


            if (
                Number.isFinite(grams) &&
                grams > 0
            ) {

                foodResult.textContent =
                    Math.round(
                        grams
                    ).toLocaleString();

                foodUnit.textContent =
                    "g/day";

            } else {

                foodResult.textContent =
                    "—";

                foodUnit.textContent =
                    "Unable to calculate";

            }

        } else {

            foodResult.textContent =
                "—";

            foodUnit.textContent =
                "Add kcal/100g";

        }


        /* -----------------------------------------------------
           SHOW RESULT
        ----------------------------------------------------- */

        calculatorPlaceholder.style.display =
            "none";

        calculatorResult.classList.add(
            "show"
        );


        /* -----------------------------------------------------
           ACCESSIBILITY
        ----------------------------------------------------- */

        calculatorResult.setAttribute(
            "aria-live",
            "polite"
        );


        /* -----------------------------------------------------
           DON'T FORCE SCROLL

           Keeping the user where they are is better UX.
        ----------------------------------------------------- */

    };


    /* ---------------------------------------------------------
       ENTER KEY
    --------------------------------------------------------- */

    petWeight.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                calculatePetNeeds();

            }

        }
    );


    foodCalories.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                calculatePetNeeds();

            }

        }
    );


})();

/* =========================================================
   SAFETY CHECKER
========================================================= */

window.checkIngredient = function () {

    const input =
        document
            .getElementById(
                "ingredientInput"
            )
            .value
            .trim()
            .toLowerCase();


    const result =
        document.getElementById(
            "safetyResult"
        );


    /* -----------------------------------------------------
       EMPTY INPUT
    ----------------------------------------------------- */

    if (!input) {

        result.className =
            "safety-result show safety-caution";

        result.innerHTML =
            "<strong>Enter an ingredient.</strong><br>" +
            "Try grapes, chicken, garlic, carrot, chocolate or pumpkin.";

        return;

    }


    /* -----------------------------------------------------
       FIND MATCH
    ----------------------------------------------------- */

    let match = null;


    /* Exact match */

    if (
        Object.prototype.hasOwnProperty.call(
            ingredientDatabase,
            input
        )
    ) {

        match =
            ingredientDatabase[input];

    }


    /* Partial match */

    if (!match) {

        for (
            const key of Object.keys(
                ingredientDatabase
            )
        ) {

            if (
                input.includes(key)
            ) {

                match =
                    ingredientDatabase[key];

                break;

            }

        }

    }


    /* -----------------------------------------------------
       UNKNOWN INGREDIENT
    ----------------------------------------------------- */

    if (!match) {

        result.className =
            "safety-result show safety-caution";

        result.innerHTML =
            "<strong>Not found in our quick-reference database.</strong><br>" +
            "This does NOT mean the ingredient is safe. Avoid feeding unfamiliar ingredients until you have verified them with a reliable veterinary source or your veterinarian.";

        return;

    }


    /* -----------------------------------------------------
       RESULT STYLE
    ----------------------------------------------------- */

    let className =
        "safety-caution";


    if (
        match.status === "safe"
    ) {

        className =
            "safety-safe";

    }

    else if (
        match.status === "danger"
    ) {

        className =
            "safety-danger";

    }


    result.className =
        "safety-result show " +
        className;


    result.innerHTML =
        "<strong>" +
        escapeHTML(match.title) +
        "</strong><br>" +
        escapeHTML(match.text);

};


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   SHARE FUNCTIONS
========================================================= */

function getCurrentPageURL() {

    return window.location.href;

}


function getCurrentPageTitle() {

    return document.title;

}


window.shareFacebook = function () {

    const url =
        encodeURIComponent(
            getCurrentPageURL()
        );

    window.open(
        "https://www.facebook.com/sharer/sharer.php?u=" +
        url,
        "_blank",
        "noopener,noreferrer"
    );

};


window.shareWhatsApp = function () {

    const text =
        encodeURIComponent(
            getCurrentPageTitle() +
            " " +
            getCurrentPageURL()
        );

    window.open(
        "https://api.whatsapp.com/send?text=" +
        text,
        "_blank",
        "noopener,noreferrer"
    );

};


window.sharePinterest = function () {

    const url =
        encodeURIComponent(
            getCurrentPageURL()
        );

    const description =
        encodeURIComponent(
            getCurrentPageTitle()
        );

    window.open(
        "https://pinterest.com/pin/create/button/?url=" +
        url +
        "&description=" +
        description,
        "_blank",
        "noopener,noreferrer"
    );

};


window.shareX = function () {

    const url =
        encodeURIComponent(
            getCurrentPageURL()
        );

    const text =
        encodeURIComponent(
            getCurrentPageTitle()
        );

    window.open(
        "https://twitter.com/intent/tweet?text=" +
        text +
        "&url=" +
        url,
        "_blank",
        "noopener,noreferrer"
    );

};


/* =========================================================
   COPY PAGE LINK
========================================================= */

window.copyLink = async function () {

    const url =
        window.location.href;


    /* Modern Clipboard API */

    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        try {

            await navigator.clipboard.writeText(
                url
            );

            alert(
                "Page link copied!"
            );

            return;

        } catch (error) {

            /* Fall through to legacy method */

        }

    }


    /* Legacy fallback */

    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        url;

    textarea.style.position =
        "fixed";

    textarea.style.left =
        "-9999px";

    textarea.setAttribute(
        "readonly",
        ""
    );


    document.body.appendChild(
        textarea
    );


    textarea.select();


    try {

        document.execCommand(
            "copy"
        );

        alert(
            "Page link copied!"
        );

    } catch (error) {

        alert(
            "Unable to copy automatically. Please copy the URL from your browser."
        );

    }


    document.body.removeChild(
        textarea
    );

}

</script>
