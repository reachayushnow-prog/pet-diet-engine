<style>
/* ================================
   GLOBAL
================================ */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f8fafc;
  color: #172033;
  line-height: 1.65;
}

img {
  max-width: 100%;
}

a {
  color: inherit;
}


/* ================================
   NAVIGATION
================================ */
.navbar {
  position: sticky;
  top: 0;
  z-index: 9999;
  min-height: 64px;
}


/* ================================
   HERO
================================ */
.hero {
  margin-top: 28px;
  padding: 64px 56px;
  border-radius: 24px;

  background:
    radial-gradient(
      circle at 90% 10%,
      rgba(37, 99, 235, 0.35),
      transparent 35%
    ),
    linear-gradient(135deg, #0f172a, #172554);

  color: #fff;
  overflow: hidden;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 45px;
  align-items: center;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  padding: 7px 12px;
  margin-bottom: 20px;

  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(110, 231, 183, 0.35);
  border-radius: 999px;

  color: #6ee7b7;
  font-size: 0.88rem;
  font-weight: 700;
}

.hero h1 {
  margin: 0 0 22px;

  font-size: clamp(2.3rem, 5vw, 3.7rem);
  line-height: 1.12;
  letter-spacing: -0.04em;
}

.hero h1 span {
  color: #60a5fa;
}

.hero-text {
  max-width: 620px;
  margin: 0 0 30px;

  color: #dbe4f0;
  font-size: 1.08rem;
  line-height: 1.7;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.btn {
  min-height: 46px;

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;

  padding: 12px 20px;

  border-radius: 10px;
  border: 1px solid transparent;

  font-weight: 700;
  text-decoration: none;

  cursor: pointer;
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    background 0.2s ease;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn:focus-visible,
input:focus-visible,
select:focus-visible,
button:focus-visible {
  outline: 3px solid rgba(59, 130, 246, 0.45);
  outline-offset: 2px;
}

.btn-primary {
  background: #10b981;
  color: #ffffff;
}

.btn-primary:hover {
  background: #059669;
  box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.08);
  color: #ffffff;
  border-color: rgba(255, 255, 255, 0.25);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.14);
}

.hero-image img {
  width: 100%;
  height: 340px;
  object-fit: cover;
  display: block;
  border-radius: 18px;
}


/* ================================
   CALCULATOR FORM
================================ */
.form-group input,
.form-group select {
  width: 100%;
  min-height: 48px;

  padding: 12px 13px;

  border: 1px solid #cbd5e1;
  border-radius: 9px;

  background: #ffffff;
  color: #0f172a;

  outline: none;
}

.form-group input:focus,
.form-group select:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
}

.calculate-btn {
  width: 100%;
  min-height: 48px;
}


/* ================================
   SAFETY CHECKER
================================ */
.safety-form input {
  min-height: 48px;
}

.safety-form button {
  min-height: 48px;
}


/* ================================
   MOBILE
================================ */
@media (max-width: 700px) {

  .navbar {
    min-height: 62px;
  }

  .hero {
    margin-top: 18px;
    padding: 42px 22px;
    border-radius: 18px;
  }

  .hero-grid {
    grid-template-columns: 1fr;
    gap: 28px;
  }

  .hero h1 {
    font-size: clamp(2rem, 9vw, 2.6rem);
    line-height: 1.12;
    letter-spacing: -0.035em;
  }

  .hero-text {
    font-size: 1rem;
    line-height: 1.65;
    margin-bottom: 24px;
  }

  .hero-image img {
    height: 230px;
    border-radius: 14px;
  }

  .hero-actions {
    flex-direction: column;
    gap: 10px;
  }

  .hero-actions .btn {
    width: 100%;
    min-height: 48px;
  }

  .calculator-card,
  .calculator-container {
    padding: 22px;
  }

  .tools-grid,
  .guides-grid,
  .why-grid {
    grid-template-columns: 1fr;
  }

  .safety-form {
    grid-template-columns: 1fr;
  }

  .footer-grid {
    grid-template-columns: 1fr;
  }

  /* Keep important navigation items visible */
  .nav-menu li:nth-child(2) {
    display: none;
  }
}


/* ================================
   REDUCED MOTION
================================ */
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    transition: none !important;
    animation: none !important;
  }
}
</style>
